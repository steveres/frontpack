<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Front Pack - Bicycle Routes</title>
    
    <!-- CSS imports in correct order -->
    <link rel="stylesheet" href="/css/base/reset.css">
    <link rel="stylesheet" href="/css/base/variables.css">
    <link rel="stylesheet" href="/css/components/navigation.css">
    <link rel="stylesheet" href="/css/components/index.css">
    
    <!-- JavaScript imports -->
    <script src="/js/components/navigation.js" defer></script>
    <script src="/js/utils/auth-helpers.js" defer></script>
    <script src="/js/components/index.js" defer></script>
</head>
<body>
    <!-- Navigation placeholder -->
    <div id="navigation-placeholder"></div>

    <!-- Main content -->
    <main class="home-container">
        <!-- Background images will be inserted here by index.js -->
        <div class="home-content">
            <h1>Welcome to FrontPack.</h1>
            <p>
                Around the block or around the world, FrontPack Keeps cyclists connected. 
                Since 2019, we partned with <a href="https://www.adventurecycling.org/">Adventure Cycling</a> to deliver their <a href="https://www.adventurecycling.org/routes-and-maps/adventure-cycling-route-network/">iconic maps</a> throuh our co-branded mobile apps. By 2024, cyclists navigated over 25,000,000 miles! 
            </p>
            <p>
                Curious? Read our story <a href="/about.html">here</a>.
            </p>
            <!-- <div class="home-images">
                <img src="/images/icefieldshighway.jpg" alt="Cycling route 1">
                <img src="/images/alaskahighway.jpg" alt="Cycling route 2">
                <img src="/images/stream.jpg" alt="Cycling route 3">
            </div> -->
        </div>
    </main>

    <script>
        // Load and inject the navigation
        fetch('/components/navigation.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navigation-placeholder').innerHTML = html;
                if (window.initNavigation) {
                    window.initNavigation();
                }
            })
            .catch(error => console.error('Error loading navigation:', error));
    </script>
</body>
</html>
