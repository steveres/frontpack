<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Details - Front Pack</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images//favicon.png">
    
    <!-- CSS imports -->
    <link rel="stylesheet" href="/css/base/reset.css">
    <link rel="stylesheet" href="/css/base/variables.css">
    <link rel="stylesheet" href="/css/components/navigation.css">
    <link rel="stylesheet" href="/css/components/route-detail.css">

    <!-- Google Maps -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBVwsr29swEsCPwRy9cRMyHDJi0LDoLdns"></script>    

    <!-- JavaScript imports -->
    <script src="/js/components/navigation.js" defer></script>
    <script src="/js/api/auth-api.js" defer></script>
    <script src="/js/utils/nav-helpers.js" defer></script>
    <script src="/js/api/routes-api.js" defer></script>
    <script src="/js/components/route-detail.js" defer></script>
</head>
<body>
    <!-- Navigation placeholder -->
    <div id="navigation-placeholder"></div>

    <!-- Main content -->
    <main class="main-content route-detail">
        <!-- Info Panel -->
        <div class="info-panel">
            <div id="route-info" class="route-info hidden">
                <!-- Content will be inserted here -->
            </div>
            <div id="loading-state" class="loading-state">
                <img src="/images/spinningtire.gif" alt="Loading..." class="loading-spinner">
            </div>
            <div id="error-state" class="error-state hidden">
                Error loading route details.
            </div>
        </div>

        <!-- Map Panel -->
        <div class="map-panel">
            <div id="map" class="map-container"></div>
        </div>
    </main>

    <script>
        // Load and inject the navigation
        fetch('/components/navigation.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navigation-placeholder').innerHTML = html;
                if (window.initNavigation) {
                    window.initNavigation();
                }
            })
            .catch(error => console.error('Error loading navigation:', error));
    </script>
</body>
</html>
