<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <title>Register - Front Pack</title>
    
    <!-- CSS imports -->
    <link rel="stylesheet" href="/css/base/reset.css">
    <link rel="stylesheet" href="/css/base/variables.css">
    <link rel="stylesheet" href="/css/components/navigation.css">
    <link rel="stylesheet" href="/css/components/register.css">
    
    <!-- JavaScript imports -->
    <script src="/js/components/navigation.js" defer></script>
    <script src="/js/api/auth-api.js" defer></script>
    <script src="/js/components/register.js" defer></script>
</head>
<body>
    <!-- Navigation placeholder -->
    <div id="navigation-placeholder"></div>

    <!-- Main content -->
    <main class="main-content">
        <div class="register-container">
            <div class="header-container">
                <button type="button" id="back-button" class="back-button hidden">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <h1 class="register-title">Create Account</h1>
            </div>
            
            <!-- Message containers -->
            <div id="error-message" class="error-message" role="alert" aria-live="polite"></div>
            <div id="success-message" class="success-message" role="alert" aria-live="polite"></div>            
            
            <div id="register-options" class="register-options">
                <button type="button" class="social-button google-button">
                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Continue with Google
                </button>
                <button type="button" class="social-button apple-button">
                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path d="M17.05 12.536c-.02-2.088 1.705-3.09 1.782-3.139-0.97-1.418-2.48-1.613-3.02-1.635-1.284-0.13-2.507 0.757-3.16 0.757-0.65 0-1.654-0.739-2.72-0.718-1.4 0.02-2.687 0.813-3.407 2.064-1.453 2.517-0.372 6.243 1.044 8.283 0.692 0.999 1.516 2.122 2.598 2.082 1.042-0.042 1.436-0.674 2.696-0.674 1.259 0 1.615 0.674 2.717 0.652 1.122-0.02 1.834-1.021 2.52-2.024 0.794-1.161 1.12-2.285 1.14-2.342-0.025-0.01-2.19-0.84-2.21-3.337" fill="black"/>
                    </svg>
                    Continue with Apple
                </button>
                <div class="divider">
                    <span>OR</span>
                </div>
                <button type="button" id="email-signup-button" class="email-button">
                    Sign up with Email
                </button>
            </div>

            <form id="register-form" class="register-form hidden">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" 
                           id="name" 
                           name="name" 
                           required 
                           autocomplete="name"
                           aria-required="true">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" 
                           id="email" 
                           name="email" 
                           required 
                           autocomplete="email"
                           aria-required="true">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           required
                           autocomplete="new-password"
                           aria-required="true">
                </div>

                <button type="submit" class="register-button">
                    <span class="button-text">Create a Free Account</span>
                    <span class="button-loader"></span>
                </button>
            </form>

            <p class="terms-text">
                By creating an account you are accepting our 
                <a href="/terms">Terms of Service</a> and 
                <a href="/privacy">Privacy Policy</a>. 
                We may occasionally send you email with product updates, 
                and you can unsubscribe at any time.
            </p>
        </div>
    </main>
</body>
</html>
