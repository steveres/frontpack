<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <title>Login - Front Pack</title>
    
    <!-- CSS imports -->
    <link rel="stylesheet" href="/css/base/reset.css">
    <link rel="stylesheet" href="/css/base/variables.css">
    <link rel="stylesheet" href="/css/base/shared.css">
    <link rel="stylesheet" href="/css/components/navigation.css">
    <link rel="stylesheet" href="/css/components/login.css">
    
    <!-- JavaScript imports -->
    <script src="/js/components/navigation.js" defer></script>
    <script src="/js/api/auth-api.js" defer></script>
    <script src="/js/components/login.js" defer></script>
</head>
<body>
    <!-- Navigation placeholder -->
    <div id="navigation-placeholder"></div>

    <!-- Main content -->
    <main class="main-content">
        <div class="login-container content-container">

            <p class="signup-text">
                Don't have an account? <a href="/register.html">Sign up for FREE</a>
            </p>

            <h1 class="login-title">Login</h1>
            
            <!-- Error message container -->
            <div id="error-message" class="message error-message" role="alert" aria-live="polite"></div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" 
                           id="email" 
                           name="email" 
                           required 
                           autocomplete="email"
                           aria-required="true">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           required
                           autocomplete="current-password"
                           aria-required="true">
                </div>

                <button type="submit" class="button button-primary">
                    <span class="button-text">Login</span>
                    <span class="button-loader"></span>
                </button>
            </form>

        </div>
    </main>

</body>
</html>
